<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Poker Menteur - Accueil</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #2c3e50; color: white; }
        .container { margin-top: 50px; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { cursor: pointer; background: #27ae60; color: white; font-weight: bold; }
        #room-list { list-style: none; padding: 0; }
        .room-item { background: #34495e; margin: 10px auto; padding: 10px; width: 300px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🃏 Poker Menteur</h1>
        <input type="text" id="playerName" placeholder="Ton pseudo">
        <br>
        <input type="text" id="roomName" placeholder="Nom de la table">
        <button onclick="createRoom()">Créer une table</button>
        <h2>Tables disponibles</h2>
        <ul id="room-list"></ul>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const playerNameInput = document.getElementById('playerName');
        function createRoom() {
            const room = document.getElementById('roomName').value;
            if (room) { socket.emit('createRoom', room); joinRoom(room); }
        }
        function joinRoom(room) {
            const name = playerNameInput.value || "Anonyme";
            localStorage.setItem('pokerRoom', room);
            localStorage.setItem('pokerName', name);
            window.location.href = '/game.html';
        }
        socket.on('updateRooms', (rooms) => {
            const list = document.getElementById('room-list');
            list.innerHTML = '';
            rooms.forEach(room => {
                const li = document.createElement('li');
                li.className = 'room-item';
                li.innerHTML = `${room} <button onclick="joinRoom('${room}')">Rejoindre</button>`;
                list.appendChild(li);
            });
        });
    </script>
</body>
</html>
