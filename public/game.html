<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Poker Menteur - Table</title>
    <style>
        :root { --bg: #1a1a1a; --table: #1e5d2f; --panel: #2a2a2a; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SCOREBOARD GAUCHE */
        #side-score { width: 250px; background: var(--panel); border-right: 2px solid #333; padding: 20px; }
        .player-row { padding: 10px; margin-bottom: 5px; border-radius: 5px; background: #333; display: flex; justify-content: space-between; align-items: center;}
        .player-row.active { border: 2px solid var(--gold); }
        .player-row.out { opacity: 0.4; text-decoration: line-through; }

        /* TABLE CENTRALE */
        #main-table { flex-grow: 1; display: flex; flex-direction: column; align-items: center; position: relative; background: radial-gradient(circle, #2e7d32 0%, #1b5e20 100%); }
        #cards-zone { margin-top: auto; padding-bottom: 50px; }
        .card { display: inline-block; background: white; color: black; width: 60px; height: 90px; border-radius: 8px; font-weight: bold; font-size: 1.5rem; margin: 5px; line-height: 90px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.5); border: 2px solid #ddd; }
        .card.red { color: #e74c3c; }

        /* HISTORIQUE DROITE */
        #side-history { width: 300px; background: var(--panel); border-left: 2px solid #333; padding: 20px; display: flex; flex-direction: column; }
        #bid-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; }
        .bid-entry { padding: 10px; border-bottom: 1px solid #444; font-size: 0.95rem; background: rgba(0,0,0,0.2); margin-bottom: 5px; border-radius: 5px;}
        .bid-entry span { color: var(--gold); font-weight: bold;}

        /* CONTROLES */
        #controls { background: rgba(0,0,0,0.8); width: 100%; padding: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; border-top: 2px solid #444; }
        select, button { padding: 10px; border-radius: 5px; border: none; font-weight: bold; font-size: 1rem; }
        button { cursor: pointer; transition: 0.2s; }
        #bid-btn { background: #27ae60; color: white; }
        #liar-btn { background: #e67e22; color: white; }
        
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center;}
    </style>
</head>
<body>

    <div id="side-score">
        <h2>Joueurs</h2>
        <div id="player-list"></div>
        <button onclick="window.location.href='/'" style="margin-top: 20px; width: 100%; background: #c0392b; color: white;">Quitter la table</button>
    </div>

    <div id="main-table">
        <h2 id="room-title" style="margin-top: 20px;">Table : ...</h2>
        <div id="turn-display" style="color: var(--gold); font-size: 1.5rem; margin-top: 10px;">Attente de joueurs...</div>
        
        <div id="overlay">
            <h1 id="reveal-title" style="font-size: 3rem; color: #e74c3c; margin-bottom: 10px;">MENTEUR !</h1>
            <p id="reveal-msg" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
            <div id="reveal-cards" style="margin-bottom: 20px;"></div>
            <p style="color: #7f8c8d;">Prochaine manche dans quelques secondes...</p>
        </div>

        <div id="cards-zone">
            <div id="my-cards"></div>
        </div>

        <div id="controls" style="display:none;">
            <select id="bid-combo" onchange="toggleSecondValue()">
                <option value="Carte Haute">Carte Haute</option><option value="Paire">Paire</option>
                <option value="Double Paire">Double Paire</option><option value="Brelan">Brelan</option>
                <option value="Full">Full</option><option value="Carré">Carré</option>
                <option value="Quinte">Quinte</option><option value="Quinte Flush">Quinte Flush</option>
            </select>
            <span style="color: white;">de</span>
            <select id="bid-value">
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="J">J</option><option value="Q">Q</option>
                <option value="K">K</option><option value="A">A</option>
            </select>
            
            <span id="second-val-container" style="display:none; color: white;">
                et de 
                <select id="bid-value-2">
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option><option value="J">J</option><option value="Q">Q</option>
                    <option value="K">K</option><option value="A">A</option>
                </select>
            </span>

            <button id="bid-btn">ENCHÉRIR</button>
            <button id="liar-btn" style="margin-left: 20px;">MENTEUR !</button>
        </div>
        <button id="start-btn" style="position:absolute; top:50%; padding:20px 40px; background:var(--gold); font-size: 1.5rem; font-weight: bold; border-radius: 10px; display:none;">DÉMARRER LA PARTIE</button>
    </div>

    <div id="side-history">
        <h2>Historique</h2>
        <ul id="bid-list"></ul>
    </div>

    <script>
        const socket = io();
        const roomName = localStorage.getItem('pokerRoom');
        const playerName = localStorage.getItem('pokerName');
        let currentNextPlayer = "";

        socket.emit('joinRoom', { roomName, playerName });

        // Affiche ou cache le deuxième menu déroulant selon la combinaison
        function toggleSecondValue() {
            const combo = document.getElementById('bid-combo').value;
            const container = document.getElementById('second-val-container');
            if (combo === "Double Paire" || combo === "Full") {
                container.style.display = "inline";
            } else {
                container.style.display = "none";
            }
        }

        socket.on('updatePlayers', (players) => {
            document.getElementById('room-title').innerText = "Table : " + roomName;
            const list = document.getElementById('player-list');
            list.innerHTML = players.map(p => `
                <div class="player-row ${p.isOut?'out':''} ${p.name===currentNextPlayer?'active':''}">
                    <span>${p.name} ${p.name === playerName ? '(Toi)' : ''}</span>
                    <span>${p.isOut ? '💀' : '🂠'.repeat(p.cards.length || 1)}</span>
                </div>
            `).join('');
            if(players.length >= 2) document.getElementById('start-btn').style.display = 'block';
        });

        document.getElementById('start-btn').onclick = () => {
            socket.emit('startGame', roomName);
            document.getElementById('start-btn').style.display = 'none';
        };

        socket.on('yourCards', (cards) => {
            document.getElementById('my-cards').innerHTML = cards.map(c => `
                <div class="card ${c.includes('♥')||c.includes('♦')?'red':''}">${c}</div>
            `).join('');
        });

        socket.on('roundStarted', () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('bid-list').innerHTML = '';
        });

        socket.on('updateGameState', (data) => {
            currentNextPlayer = data.nextPlayer;
            document.getElementById('turn-display').innerText = `👉 Au tour de : ${data.nextPlayer}`;
            
            if(data.bidHistory) {
                const list = document.getElementById('bid-list');
                list.innerHTML = data.bidHistory.map(b => {
                    // Formatage du texte selon s'il y a 1 ou 2 valeurs
                    let text = `${b.combo} de ${b.value}`;
                    if (b.value2) text += ` et de ${b.value2}`;
                    return `<li class="bid-entry"><span>${b.playerName}</span><br>${text}</li>`;
                }).reverse().join('');
            }

            const isMyTurn = (data.nextPlayer === playerName);
            document.getElementById('bid-btn').disabled = !isMyTurn;
            document.getElementById('bid-btn').style.opacity = isMyTurn ? '1' : '0.5';
            document.getElementById('liar-btn').disabled = !isMyTurn || data.bidHistory.length === 0;
            document.getElementById('liar-btn').style.opacity = (!isMyTurn || data.bidHistory.length === 0) ? '0.5' : '1';
        });

        document.getElementById('bid-btn').onclick = () => {
            const combo = document.getElementById('bid-combo').value;
            const val1 = document.getElementById('bid-value').value;
            let val2 = null;

            if (combo === "Double Paire" || combo === "Full") {
                val2 = document.getElementById('bid-value-2').value;
                if (val1 === val2) {
                    alert("Pour une Double Paire ou un Full, les deux cartes doivent être différentes !");
                    return;
                }
            }

            socket.emit('placeBid', { roomName, bid: { 
                combo: combo, 
                value: val1,
                value2: val2,
                playerName: playerName 
            }});
        };

        document.getElementById('liar-btn').onclick = () => socket.emit('callLiar', roomName);

        socket.on('revealAll', (data) => {
            const over = document.getElementById('overlay');
            over.style.display = 'flex';
            
            let elimText = data.eliminated ? `<br><strong style="color: #f1c40f;">💀 ÉLIMINÉ ! 💀</strong>` : ` (prend 1 carte)`;
            
            document.getElementById('reveal-cards').innerHTML = data.cards.map(c => `
                <div class="card ${c.includes('♥')||c.includes('♦')?'red':''}">${c}</div>
            `).join('');
            
            document.getElementById('reveal-msg').innerHTML = `
                L'annonce était <strong>${data.isBidTrue ? 'VRAIE' : 'FAUSSE'}</strong>.<br>
                <span style="font-size: 1.5rem;"><strong>${data.loserName}</strong> perd ce round${elimText}</span>
            `;
        });
        
        socket.on('gameOver', (data) => {
            alert(`🎉 PARTIE TERMINÉE ! Le gagnant est ${data.winner} ! 🎉`);
            window.location.href = '/';
        });
    </script>
</body>
</html>
