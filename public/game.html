<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gemini Table</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --gold: #d4af37; --table: #074d21; --wood: #2c1e14; }
        body { margin:0; background:#050505; color:white; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }
        #table { width:700px; height:350px; background:var(--table); border:15px solid var(--wood); border-radius:200px; position:relative; margin:auto; box-shadow: inset 0 0 100px black; }
        .player { position:absolute; width:100px; text-align:center; transform: translate(-50%, -50%); }
        .avatar { width:60px; height:60px; background:#222; border-radius:50%; margin:auto; display:flex; align-items:center; justify-content:center; border:2px solid #444; }
        .active .avatar { border-color:var(--gold); box-shadow:0 0 20px var(--gold); }
        #controls { height:150px; background:#111; border-top:2px solid var(--gold); display:none; align-items:center; justify-content:center; gap:15px; }
        button { padding:10px 20px; font-weight:bold; cursor:pointer; border-radius:5px; border:none; }
    </style>
</head>
<body>
    <div id="status" style="text-align:center; padding:10px; color:var(--gold); font-weight:bold;">Attente des joueurs...</div>
    <div id="table"><div id="players-layer"></div></div>
    <div id="controls">
        Miser : <input type="number" id="b-c" value="1" min="1" style="width:40px">
        de <select id="b-v"><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">V</option><option value="12">D</option><option value="13">R</option><option value="14">As</option></select>
        <button onclick="sendBid()" style="background:var(--gold)">ANNONCER</button>
        <button onclick="sendLiar()" style="background:red; color:white;">MENTEUR !</button>
    </div>
    <div id="my-cards" style="display:flex; justify-content:center; gap:5px; margin-bottom:10px;"></div>
    <button id="start-btn" onclick="socket.emit('startGame', roomId)" style="display:none; position:fixed; top:20px; right:20px; background:var(--gold); padding:10px;">LANCER</button>

    <script>
        const socket = io();
        const roomId = sessionStorage.getItem('p_r');
        const myName = sessionStorage.getItem('p_n');
        socket.emit('joinRoom', { roomId, playerName: myName });

        socket.on('updatePlayers', (players) => {
            const layer = document.getElementById('players-layer'); layer.innerHTML = "";
            players.forEach((p, i) => {
                const angle = (i / players.length) * Math.PI * 2;
                const x = 350 + Math.cos(angle) * 300;
                const y = 175 + Math.sin(angle) * 140;
                layer.innerHTML += `<div class="player" id="p-${p.id}" style="left:${x}px; top:${y}px">
                    <div class="avatar">${p.name[0]}</div>
                    <div style="font-size:0.8rem">${p.name}</div>
                    <div style="color:red">${"💀".repeat(p.penalties)}</div>
                </div>`;
            });
            if(players.length >= 2 && players[0].id === socket.id) document.getElementById('start-btn').style.display = "block";
        });

        socket.on('yourCards', (cards) => {
            document.getElementById('my-cards').innerHTML = cards.map(c => `<div style="background:white; color:black; padding:8px; border-radius:4px; font-weight:bold">${c.v}</div>`).join('');
        });

        socket.on('roundStarted', (data) => {
            document.getElementById('start-btn').style.display = "none";
            updateTurn(data.turnId);
        });

        socket.on('bidUpdate', (data) => {
            document.getElementById('status').innerText = `${data.playerName} a misé ${data.bid.count} x ${data.bid.v}`;
            updateTurn(data.nextTurn);
        });

        socket.on('liarResult', (data) => {
            alert(`${data.loserName} perd ! Il y avait ${data.totalCards} fois la valeur ${data.bidValue}.`);
        });

        socket.on('gameOver', (data) => { alert("FIN DE PARTIE ! Le gagnant est : " + data.winner); window.location.href = '/'; });

        function updateTurn(id) {
            document.querySelectorAll('.player').forEach(el => el.classList.remove('active'));
            if(document.getElementById('p-'+id)) document.getElementById('p-'+id).classList.add('active');
            document.getElementById('controls').style.display = (id === socket.id) ? "flex" : "none";
        }

        function sendBid() {
            const bid = { count: parseInt(document.getElementById('b-c').value), v: parseInt(document.getElementById('b-v').value) };
            socket.emit('makeBid', { roomId, bid });
        }
        function sendLiar() { socket.emit('callLiar', roomId); }
    </script>
</body>
</html>
