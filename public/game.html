<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Poker Menteur - Jeu</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a252f; color: white; }
        .header { display: flex; justify-content: space-between; padding: 20px; }
        #leave-btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        #start-btn { background: #f1c40f; color: #333; font-size: 1.2em; padding: 15px 30px; margin-top: 20px; border: none; border-radius: 5px; cursor: pointer; }
        .card { display: inline-block; background: white; color: black; padding: 15px; border-radius: 8px; font-size: 2em; font-weight: bold; margin: 10px; min-width: 40px; }
        .red { color: #e74c3c; }
        #bid-area { background: #34495e; padding: 20px; margin: 20px auto; width: 80%; border-radius: 10px; }
        select, input { padding: 10px; font-size: 1em; border-radius: 5px; }
        #bid-btn { background: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 1.1em; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="room-title">Table : ...</h2>
        <button id="leave-btn">Quitter</button>
    </div>

    <div id="lobby">
        <h3>Joueurs présents :</h3>
        <ul id="player-list" style="list-style: none; padding: 0;"></ul>
        <button id="start-btn" style="display:none;">Lancer la Partie !</button>
    </div>

    <div id="game-area" style="display:none;">
        <div id="my-hand">
            <p>Ta carte :</p>
            <div id="cards-display"></div>
        </div>

        <div id="bid-area">
            <h3 id="turn-info" style="color: #f1c40f;">C'est au tour de...</h3>
            <p id="last-bid">Aucune enchère.</p>
            <hr>
            <h4>Faire une annonce :</h4>
            Il y a au moins 
            <input type="number" id="bid-count" value="1" min="1" style="width: 50px;">
            fois la carte 
            <select id="bid-value">
                <option value="7">7</option><option value="8">8</option>
                <option value="9">9</option><option value="10">10</option>
                <option value="J">Valet</option><option value="Q">Dame</option>
                <option value="K">Roi</option><option value="A">As</option>
            </select>
            <br><br>
            <button id="bid-btn">Enchérir</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const roomName = localStorage.getItem('pokerRoom');
        const playerName = localStorage.getItem('pokerName');

        document.getElementById('room-title').innerText = "Table : " + roomName;
        socket.emit('joinRoom', { roomName, playerName });

        document.getElementById('leave-btn').addEventListener('click', () => {
            if(confirm("Quitter la table ?")) window.location.href = '/';
        });

        socket.on('updatePlayers', (players) => {
            const list = document.getElementById('player-list');
            list.innerHTML = players.map(p => `<li>👤 ${p.name}</li>`).join('');
            document.getElementById('start-btn').style.display = (players.length >= 2) ? 'inline-block' : 'none';
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            socket.emit('startGame', roomName);
        });

        socket.on('yourCards', (cards) => {
            const display = document.getElementById('cards-display');
            display.innerHTML = cards.map(c => {
                const isRed = c.includes('♥') || c.includes('♦');
                return `<div class="card ${isRed ? 'red' : ''}">${c}</div>`;
            }).join('');
        });

        socket.on('gameStarted', () => {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
        });

        // GESTION DES ENCHÈRES
        document.getElementById('bid-btn').addEventListener('click', () => {
            const count = document.getElementById('bid-count').value;
            const value = document.getElementById('bid-value').value;
            socket.emit('placeBid', {
                roomName: roomName,
                bid: { count, value, playerName: playerName }
            });
        });

        socket.on('updateGameState', (data) => {
            if (data.currentBid) {
                document.getElementById('last-bid').innerHTML = 
                    `Dernière annonce : <strong>${data.currentBid.count} x ${data.currentBid.value}</strong> par <span style="color:#f1c40f">${data.currentBid.playerName}</span>`;
            }
            document.getElementById('turn-info').innerText = `👉 Tour de : ${data.nextPlayer}`;
            
            // On désactive le bouton si ce n'est pas notre tour
            document.getElementById('bid-btn').disabled = (data.nextPlayer !== playerName);
            document.getElementById('bid-btn').style.opacity = (data.nextPlayer !== playerName) ? "0.5" : "1";
        });
    </script>
</body>
</html>
