<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Poker Menteur</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a252f; color: white; margin: 0; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #16a085; }
        .card { display: inline-block; background: white; color: black; padding: 10px; border-radius: 5px; font-weight: bold; margin: 5px; border: 2px solid #333; }
        .red { color: #e74c3c; }
        #bid-area { background: #34495e; padding: 20px; margin: 10px auto; width: 90%; border-radius: 10px; }
        button { padding: 12px 20px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; margin: 5px; }
        #bid-btn { background: #27ae60; color: white; }
        #liar-btn { background: #e67e22; color: white; }
        #reveal-zone { background: #c0392b; padding: 15px; display: none; margin: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h3 id="room-title">Table</h3>
        <button onclick="window.location.href='/'">Quitter</button>
    </div>

    <div id="lobby">
        <ul id="player-list"></ul>
        <button id="start-btn" style="display:none; background: #f1c40f;">Lancer la Partie</button>
    </div>

    <div id="game-area" style="display:none;">
        <div id="reveal-zone"></div>
        
        <div id="my-hand">
            <p>Ta main :</p>
            <div id="cards-display"></div>
        </div>

        <div id="bid-area">
            <h2 id="turn-info">...</h2>
            <div id="last-bid" style="font-size: 1.2em; background: #2c3e50; padding: 10px; border-radius: 5px;">Aucune annonce</div>
            <hr>
            <h4>Faire une surenchère :</h4>
            Combinaison :
            <select id="bid-combo">
                <option value="Carte Haute">Carte Haute</option>
                <option value="Paire">Paire</option>
                <option value="Double Paire">Double Paire</option>
                <option value="Brelan">Brelan</option>
                <option value="Quinte">Quinte</option>
                <option value="Full">Full</option>
                <option value="Carré">Carré</option>
                <option value="Quinte Flush">Quinte Flush</option>
            </select>
            de
            <select id="bid-value">
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="J">Valet</option><option value="Q">Dame</option>
                <option value="K">Roi</option><option value="A">As</option>
            </select>
            <br><br>
            <button id="bid-btn">Surenchérir</button>
            <button id="liar-btn" style="display:none;">MENTEUR !</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const roomName = localStorage.getItem('pokerRoom');
        const playerName = localStorage.getItem('pokerName');
        const comboOrder = ["Carte Haute", "Paire", "Double Paire", "Brelan", "Quinte", "Full", "Carré", "Quinte Flush"];

        document.getElementById('room-title').innerText = "Table : " + roomName;
        socket.emit('joinRoom', { roomName, playerName });

        socket.on('updatePlayers', (p) => {
            document.getElementById('player-list').innerHTML = p.map(u => `<li>${u.name}</li>`).join('');
            document.getElementById('start-btn').style.display = p.length >= 2 ? 'block' : 'none';
        });

        document.getElementById('start-btn').onclick = () => socket.emit('startGame', roomName);

        socket.on('yourCards', (cards) => {
            document.getElementById('cards-display').innerHTML = cards.map(c => `<div class="card ${c.includes('♥')||c.includes('♦')?'red':''}">${c}</div>`).join('');
        });

        socket.on('gameStarted', () => {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('reveal-zone').style.display = 'none';
        });

        document.getElementById('bid-btn').onclick = () => {
            const combo = document.getElementById('bid-combo').value;
            const val = document.getElementById('bid-value').value;
            socket.emit('placeBid', { roomName, bid: { combo, value: val, playerName } });
        };

        document.getElementById('liar-btn').onclick = () => socket.emit('callLiar', roomName);

        socket.on('updateGameState', (data) => {
            if (data.currentBid) {
                document.getElementById('last-bid').innerHTML = `Annonce : <strong>${data.currentBid.combo} de ${data.currentBid.value}</strong> par ${data.currentBid.playerName}`;
                document.getElementById('liar-btn').style.display = (data.nextPlayer === playerName) ? 'inline-block' : 'none';
            }
            document.getElementById('turn-info').innerText = data.nextPlayer === playerName ? "À TOI DE JOUER !" : `Tour de ${data.nextPlayer}`;
            document.getElementById('bid-btn').disabled = data.nextPlayer !== playerName;
        });

        socket.on('revealAll', (data) => {
            const zone = document.getElementById('reveal-zone');
            zone.style.display = 'block';
            zone.innerHTML = `<h3>${data.caller} a dit MENTEUR !</h3><p>Toutes les cartes :</p>` + 
                data.cards.map(c => `<div class="card">${c}</div>`).join('');
        });

        socket.on('resetGame', () => { location.reload(); });
    </script>
</body>
</html>
